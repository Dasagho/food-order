# Cabeceras de seguridad. Se incluyen (include) en CADA location que use add_header, porque nginx
# no hereda add_header de un nivel superior cuando el location define alguno propio.
#
# __CONNECT_SRC__ e __IMG_SRC__ se sustituyen al construir la imagen (ver Dockerfile) a partir de
# VITE_API_URL: con API en el mismo origen quedan en 'self'; con una API externa se añade solo su origen.
# Las imágenes de productos (/media/<clave>) se sirven en el MISMO origen que la app, así que img-src sigue en
# 'self' data: blob: (el bucket nunca aparece en la CSP). Esta misma cabecera se aplica también a /media/.
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src __IMG_SRC__; font-src 'self'; connect-src __CONNECT_SRC__; manifest-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# HSTS solo si la petición original llegó por HTTPS (TLS lo termina el proxy de delante).
add_header Strict-Transport-Security $hsts_header always;
