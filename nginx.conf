server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Compresión (el JS/CSS pasa de ~810 KB a ~215 KB)
  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/javascript application/javascript
             application/json application/manifest+json image/svg+xml;

  # La API vive en otro origen (VITE_API_URL) o se enruta antes de este contenedor:
  # nunca debe contestarse con index.html ni cachearse.
  location ^~ /v1/ {
    add_header Cache-Control "no-store" always;
    return 404;
  }

  # SPA: archivo si existe; si no, index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Lo que decide qué versión de la app se carga: SIEMPRE revalidar,
  # si no el navegador puede quedarse con una versión antigua.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
  location ~ ^/(sw\.js|manifest\.webmanifest|workbox-[^/]+\.js)$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Assets con hash en el nombre (vite): nunca cambian -> caché de 1 año
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Imágenes y otros estáticos con nombre fijo (public/): pueden reemplazarse,
  # así que se revalidan en lugar de marcarse immutable
  location ~* \.(?:png|jpe?g|gif|svg|ico|webp|woff2?)$ {
    add_header Cache-Control "public, max-age=86400, must-revalidate";
    try_files $uri =404;
  }
}
