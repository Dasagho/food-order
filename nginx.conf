# Servidor estático de la PWA + proxy inverso a la API (mismo origen).
# Imagen nginx-unprivileged: corre sin root y escucha en 8080. Todo lo que escribe va a /tmp.
#
# Plantilla: render-nginx.sh sustituye al construir la imagen los marcadores de destino de /v1/ y de /media/
# (ARG API_UPSTREAM y MEDIA_UPSTREAM del Dockerfile) y conserva solo uno de los bloques «media-on» / «media-off».

# Protocolo original de la petición (el proxy TLS de delante manda X-Forwarded-Proto; si no hay, el nuestro).
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}
# HSTS solo cuando el cliente llegó por HTTPS; con valor vacío nginx no emite la cabecera.
map $forwarded_proto $hsts_header {
  default "";
  https   "max-age=31536000; includeSubDomains";
}

# Caché de las imágenes de /media (SPEC §6.6): el bucket (RustFS) recibe pocas peticiones. Vive en /tmp (tmpfs
# del compose, el único sitio escribible de la imagen); max_size es un tope blando (< tmpfs de 64m).
# use_temp_path=off: los ficheros temporales se escriben ya dentro de la caché (sin copiar entre directorios).
proxy_cache_path /tmp/media-cache levels=1:2 keys_zone=media:1m max_size=20m inactive=7d use_temp_path=off;

# Cache-Control por defecto SOLO si el objeto del bucket no trae el suyo (las subidas de la API llevan
# «public, max-age=31536000, immutable» y se respetan tal cual). add_header no emite la cabecera si el valor es vacío.
map $upstream_http_cache_control $media_cache_control {
  default "";
  ""      "public, max-age=86400";
}

server {
  listen 8080;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  # IP real del cliente cuando delante hay otro proxy en la red privada de Docker
  # (rango privado únicamente: un cliente externo no puede falsear X-Forwarded-For).
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  set_real_ip_from 127.0.0.1;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  # Límites básicos contra clientes lentos o abusivos.
  client_header_timeout 10s;
  client_body_timeout 15s;
  send_timeout 15s;
  keepalive_timeout 30s;
  client_max_body_size 16m;  # subida de imágenes: hasta 15 MB (la API las reduce) + sobrecarga multipart

  # Compresión: se sirven los .gz precomprimidos al construir; el resto, al vuelo.
  gzip_static on;
  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/javascript application/javascript
             application/json application/manifest+json image/svg+xml;

  # Sondeo de salud (no se registra).
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # API: proxy a la red interna de Docker. El nombre se resuelve en cada petición (resolver de Docker),
  # así nginx arranca aunque la API aún no exista. Las cabeceras y la caché las decide la API
  # (p. ej. las imágenes subidas son inmutables); nunca se responde con index.html.
  location ^~ /v1/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream __API_UPSTREAM__;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
  }

  # Imágenes de productos: /media/<clave> -> <MEDIA_UPSTREAM>/<clave>  (bucket S3 de lectura pública, RustFS).
  # Mismo origen que la app: sin CORS ni cambios de CSP/service worker. Solo GET/HEAD y solo claves válidas
  # (<uuid>.webp, o legacy/<nombre>.webp): cualquier otra cosa es 404 sin llegar al bucket. La URI que ve nginx
  # ya está normalizada (sin «..» ni «//»), y la regex no admite nada fuera de [A-Za-z0-9._/-].
  # ^~ aparta /media/ de las reglas regex de más abajo (imágenes, .map, ficheros ocultos).
  location = /media {
    return 404;
  }

  #>> media-on
  location ^~ /media/ {
    location ~ ^/media/(?<media_key>[A-Za-z0-9][A-Za-z0-9._/-]*\.webp)$ {
      limit_except GET HEAD { deny all; }

      # Como /v1/: el nombre del bucket se resuelve en cada petición (resolver de Docker). Si MEDIA_UPSTREAM es
      # https, proxy_ssl_server_name envía el SNI. Sin parámetros de consulta: la clave es solo la ruta
      # (la caché también se indexa por URI, así que una consulta no puede envenenarla).
      resolver 127.0.0.11 valid=10s ipv6=off;
      set $media_upstream __MEDIA_UPSTREAM__;
      proxy_pass $media_upstream/$media_key;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_ssl_server_name on;
      proxy_connect_timeout 3s;
      proxy_read_timeout 15s;
      proxy_send_timeout 15s;

      # Al bucket no viaja nada de la sesión del usuario (ni Authorization, ni cookies, ni IP, ni cuerpo): nginx
      # reenvía por defecto todas las cabeceras del cliente, así que se vacían las sensibles (vacío = no se envía).
      proxy_set_header Authorization "";
      proxy_set_header Cookie "";
      proxy_set_header X-Forwarded-For "";
      proxy_set_header X-Forwarded-Proto "";
      proxy_set_header X-Forwarded-Host "";
      proxy_set_header X-Real-IP "";
      proxy_set_header Forwarded "";
      proxy_set_header Accept-Encoding "";
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";

      # Caché de proxy (clave = URI). Un 404 del bucket se devuelve como 404 (nunca index.html).
      proxy_cache media;
      proxy_cache_key $media_key;
      proxy_cache_valid 200 7d;
      proxy_cache_valid 404 1m;
      proxy_cache_lock on;
      proxy_cache_revalidate on;
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
      proxy_intercept_errors on;
      error_page 404 = @media_not_found;

      # Lo que el bucket cuenta de sí mismo no sale (x-amz-* no admite comodín en nginx: lista explícita).
      proxy_ignore_headers Set-Cookie;   # sin esto nginx no cachea respuestas con cookie (se ocultan igualmente)
      proxy_hide_header Set-Cookie;
      proxy_hide_header Server;
      proxy_hide_header X-Powered-By;
      proxy_hide_header x-amz-request-id;
      proxy_hide_header x-amz-id-2;
      proxy_hide_header x-amz-version-id;
      proxy_hide_header x-amz-delete-marker;
      proxy_hide_header x-amz-storage-class;
      proxy_hide_header x-amz-server-side-encryption;
      proxy_hide_header x-amz-expiration;
      proxy_hide_header x-amz-restore;
      proxy_hide_header x-amz-replication-status;
      proxy_hide_header x-amz-tagging-count;
      proxy_hide_header x-amz-mp-parts-count;
      proxy_hide_header x-amz-website-redirect-location;
      proxy_hide_header x-amz-object-lock-mode;
      proxy_hide_header x-amz-object-lock-retain-until-date;
      proxy_hide_header x-amz-object-lock-legal-hold;
      proxy_hide_header x-amz-checksum-crc32;
      proxy_hide_header x-amz-checksum-crc32c;
      proxy_hide_header x-amz-checksum-sha1;
      proxy_hide_header x-amz-checksum-sha256;
      proxy_hide_header x-amz-checksum-type;
      proxy_hide_header x-amz-bucket-region;
      proxy_hide_header x-amz-meta-uploaded-by;
      proxy_hide_header x-rustfs-request-id;
      proxy_hide_header x-minio-deployment-id;

      include /etc/nginx/nginx.headers.conf;   # incluye X-Content-Type-Options: nosniff
      add_header Cache-Control $media_cache_control;
      add_header X-Cache-Status $upstream_cache_status always;
    }
    return 404;   # clave no válida (se evalúa solo si no coincide la regex de arriba)
  }

  location @media_not_found {
    internal;
    types { }                       # sin tipo por extensión (.webp): el cuerpo es texto
    default_type text/plain;
    include /etc/nginx/nginx.headers.conf;
    add_header Cache-Control "public, max-age=60" always;
    return 404 "not found\n";
  }
  #<< media-on
  #>> media-off
  # MEDIA_UPSTREAM vacío: este nginx NO sirve las imágenes. /media/ lo enruta el reverse proxy de delante
  # (hacia el bucket, solo GET/HEAD); si la petición llega aquí es que no está configurado y se responde 404
  # (nunca index.html).
  location ^~ /media/ {
    types { }
    default_type text/plain;
    include /etc/nginx/nginx.headers.conf;
    add_header Cache-Control "no-store" always;
    return 404 "not found\n";
  }
  #<< media-off

  # Nada de ficheros ocultos ni mapas de código fuente.
  location ~ /\. {
    return 404;
  }
  location ~* \.map$ {
    return 404;
  }

  # SPA: archivo si existe; si no, index.html
  location / {
    limit_except GET HEAD { deny all; }
    include /etc/nginx/nginx.headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }

  # Lo que decide qué versión de la app se carga: SIEMPRE revalidar,
  # si no el navegador puede quedarse con una versión antigua.
  location = /index.html {
    limit_except GET HEAD { deny all; }
    include /etc/nginx/nginx.headers.conf;
    add_header Cache-Control "no-cache" always;
  }
  location ~ ^/(sw\.js|registerSW\.js|manifest\.webmanifest|workbox-[^/]+\.js)$ {
    limit_except GET HEAD { deny all; }
    include /etc/nginx/nginx.headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  # Assets con hash en el nombre (vite): nunca cambian -> caché de 1 año.
  # ^~ evita que la regla de imágenes de abajo (regex) gane a esta.
  location ^~ /assets/ {
    limit_except GET HEAD { deny all; }
    include /etc/nginx/nginx.headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Imágenes y fuentes con nombre fijo (public/): pueden reemplazarse,
  # así que se revalidan en lugar de marcarse immutable.
  location ~* \.(?:png|jpe?g|gif|svg|ico|webp|woff2?)$ {
    limit_except GET HEAD { deny all; }
    include /etc/nginx/nginx.headers.conf;
    add_header Cache-Control "public, max-age=86400, must-revalidate" always;
    try_files $uri =404;
  }
}
